name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -q

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Fetch the pinned chart and its subcharts
        run: |
          CHART_VERSION=$(uv run python -c "from gkh_deploy import CHART_VERSION; print(CHART_VERSION)")
          curl -sL "https://github.com/inveniosoftware/helm-invenio/archive/refs/tags/v${CHART_VERSION}.tar.gz" | tar xz
          helm dependency build "helm-invenio-${CHART_VERSION}/charts/invenio"
          echo "GKH_CHART_PATH=$PWD/helm-invenio-${CHART_VERSION}/charts/invenio" >> "$GITHUB_ENV"

      - run: uv sync
      - run: uv run pytest -q -m integration
