[pytest]
# Nothing here needs the cache: the suite is stateless 
# and talks to an instance
addopts = -p no:cacheprovider

# Disable insecure request warnings 
# This is useful for instances with self-signed certificate
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning

markers =
    publishes: creates content that cannot be deleted; needs --allow-publish
