[project]
name = "gkh-deploy"
version = "0.1.0"
description = "Produce and verify GEO Knowledge Hub deployments."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "GEO Secretariat", email = "secretariat@geosec.org" }]
dependencies = [
    "gkh-cli>=0.1.0",
    "jinja2>=3.1.6",
    "pydash>=8.1.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://gkhub.earthobservations.org"
Repository = "https://github.com/geo-knowledge-hub/gkh-deploy"

[project.scripts]
gkh-deploy = "gkh_deploy.cli:app"

[project.entry-points."gkh.commands"]
deploy = "gkh_deploy.cli:app"
validate = "gkh_validation.cli:app"

[project.entry-points.pytest11]
gkh_validation = "gkh_validation.plugin"

[project.optional-dependencies]
validation = [
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.uv.sources]
gkh-cli = { path = "../gkh-cli" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["gkh_deploy", "gkh_validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: renders against the real Helm chart; needs helm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# the suite writes en dashes in prose and in coordinate ranges, on purpose
allowed-confusables = ["–"]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "ANN", "RUF"]
ignore = ["D203", "D213", "D202", "ANN2", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
# the suite, its clients and its fixtures. The four modules above them
# (__init__, cli, plugin, settings) are library code and keep the full rules
"gkh_validation/api/*" = ["D", "ANN"]
"gkh_validation/ui/*" = ["D", "ANN"]
"gkh_validation/client/*" = ["D", "ANN"]
"gkh_validation/conftest.py" = ["ANN", "F403"]
"gkh_validation/fixtures.py" = ["D", "ANN"]
"gkh_validation/factories.py" = ["D", "ANN"]
